name: Publicar Luces, luces en la web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener videojuego
        uses: actions/checkout@v4
      - name: Validar archivo principal
        run: test -s index.html && grep -q 'LucesStatus' index.html
      - name: Preparar sitio web
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos del juego
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
