<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1230"><title>Anexado en el amor · VirtUs</title><style>html,body{margin:0;height:100%;background:#0c1026;color:#fff;font:16px system-ui,sans-serif}main{display:flex;align-items:center;justify-content:center;flex-flow:column;height:100vh;gap:18px;text-align:center;padding:20px;box-sizing:border-box}h1{font:normal 38px Georgia,serif;margin:0;color:#ff62bd}small{color:#9fe8ff}progress{width:min(80vw,350px);accent-color:#ff62bd}button{border:1px solid #ff62bd;background:#38294d;color:#fff;padding:14px;border-radius:12px;font-size:15px}p{max-width:320px;line-height:1.5;color:#ced8e4}</style></head><body><main id="loading"><small>VIRTUS PRESENTA</small><h1>Anexado en el amor</h1><p id="status">Preparando la historia…</p><progress id="progress" max="21" value="0"></progress><button id="retry" hidden onclick="location.reload()">Reintentar</button></main><script>
(async()=>{try{const files=Array.from({length:21},(_,i)=>`parte-${String(i+1).padStart(2,'0')}.txt`);let done=0;const chunks=await Promise.all(files.map(async file=>{const r=await fetch(file,{cache:'force-cache'});if(!r.ok)throw new Error('Recurso no disponible: '+file);const part=await r.text();document.getElementById('progress').value=++done;document.getElementById('status').textContent=`Cargando ilustraciones y capítulos: ${done} de ${files.length}`;return part}));const html=chunks.join('');if(!html.includes('Anexado en el amor')||!html.trim().endsWith('</html>'))throw new Error('Descarga incompleta');document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent='No se pudo cargar el juego. Revisa tu conexión e inténtalo otra vez.';document.getElementById('retry').hidden=false;console.error(e)}})();
</script></body></html>
